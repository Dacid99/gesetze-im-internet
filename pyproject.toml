[project]
name = "gesetze-im-internet"
version = "0.0.1"
description = "Simple API for gesetze-im-internet.de's xml readout"
authors = [
    {name = "david",email = "no@email.org"}
]
license = {text = "EUPL-1.1"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
